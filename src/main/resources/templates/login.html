<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Crypto Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .card-custom {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
        }
        .form-control:focus {
            background: #0f172a;
            color: #fff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }
        .btn-gradient {
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            color: white;
            font-weight: 600;
        }
        .btn-gradient:hover {
            background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center py-5">
    <div class="container text-center" style="max-width: 420px;">
        <div class="mb-4">
            <h1 class="fw-bold text-primary display-6">🚀 Crypto Trading</h1>
            <p class="text-secondary">Simulador de Mercado Digital</p>
        </div>
        <div class="card card-custom p-4 text-start">
            <h4 class="text-center mb-4 font-weight-bold">Iniciar Sesión</h4>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label text-secondary">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" required value="demo@demo.com">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Contraseña</label>
                    <input type="password" name="password" class="form-control" required value="1234">
                </div>
                <button type="submit" class="btn btn-gradient w-100 py-2 mt-2">Ingresar a la Plataforma</button>
                <div class="text-danger mt-3 text-center" th:text="${error}"></div>
            </form>
            <div class="mt-3">
                <a href="/registro" class="btn btn-outline-light btn-sm w-100">¿No tienes cuenta? Regístrate aquí</a>
            </div>
            <hr class="border-secondary mt-4">
            <div class="small text-secondary text-center">
                <span>Acceso Demo: <b>demo@demo.com</b> / 1234</span><br>
                <span>Acceso Admin: <b>admin@admin.com</b> / 1234</span>
            </div>
        </div>
    </div>
</body>
</html>
