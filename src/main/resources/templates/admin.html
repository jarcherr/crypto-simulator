<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card-custom { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .table-dark-custom { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        .table-dark-custom th { background: #334155; color: #94a3b8; }
        .table-dark-custom td { color: #f8fafc; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4 border-bottom border-secondary">
        <a class="navbar-brand fw-bold text-warning" href="#">⚙️ Panel Administrativo & Reportes</a>
        <a href="/" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
    </nav>
    <div class="container my-5">
        <h3 class="fw-bold mb-4">Gestión de Cuentas de Usuario</h3>
        <div class="table-responsive table-dark-custom mb-5">
            <table class="table align-middle mb-0">
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Saldo USD</th><th>Estado</th><th>Acción</th></tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.nombre}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(u.saldoFicticio, 1, 2)}"></td>
                        <td>
                            <span th:text="${u.activo} ? 'Activo' : 'Suspendido'" th:class="${u.activo} ? 'badge bg-success' : 'badge bg-danger'"></span>
                        </td>
                        <td>
                            <form th:action="@{/admin/suspender}" method="post" th:if="!${u.admin}">
                                <input type="hidden" name="userId" th:value="${u.id}">
                                <button type="submit" class="btn btn-sm" th:classappend="${u.activo} ? 'btn-warning' : 'btn-success'" th:text="${u.activo} ? 'Suspender' : 'Activar'"></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h3 class="fw-bold mb-4">Reporte General de Movimientos</h3>
        <div class="table-responsive table-dark-custom">
            <table class="table align-middle mb-0">
                <thead>
                    <tr><th>ID</th><th>Usuario</th><th>Tipo</th><th>Moneda</th><th>Cantidad</th><th>Precio Unitario</th><th>Fecha</th></tr>
                </thead>
                <tbody>
                    <tr th:each="tr : ${transacciones}">
                        <td th:text="${tr.id}"></td>
                        <td class="fw-bold" th:text="${tr.usuario.nombre}"></td>
                        <td><span th:text="${tr.tipo}" th:class="${tr.tipo == 'COMPRA'} ? 'badge bg-success' : 'badge bg-danger'"></span></td>
                        <td th:text="${tr.criptomoneda.simbolo}"></td>
                        <td th:text="${#numbers.formatDecimal(tr.cantidad, 1, 6)}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(tr.precioUnitario, 1, 2)}"></td>
                        <td class="text-secondary" th:text="${#temporals.format(tr.fecha, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
