<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro - Simulador Cripto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-5" style="height: 100vh;">
    <div class="container text-center" style="max-width: 400px;">
        <h2 class="mb-4">Crear Nueva Cuenta</h2>
        <div class="card shadow p-4">
            <form th:action="@{/registrar}" method="post">
                <div class="mb-3 text-start">
                    <label>Nombre:</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="mb-3 text-start">
                    <label>Correo Electrónico:</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3 text-start">
                    <label>Contraseña:</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Registrarse</button>
                <div class="text-danger mt-2" th:text="${error}"></div>
            </form>
            <hr>
            <a href="/" class="text-decoration-none">← Volver al Login</a>
        </div>
    </div>
</body>
</html>
